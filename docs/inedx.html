<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Difference Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Time Difference Calculator</h1>
    <label for="time1">Start Time (HH:MM):</label>
    <input type="text" id="time1" placeholder="e.g., 14:30">
    
    <label for="time2">End Time (HH:MM):</label>
    <input type="text" id="time2" placeholder="e.g., 18:45">
    
    <button onclick="calculateDifference()">Calculate Difference</button>
    
    <h2 id="result"></h2>
  </div>
  <script src="script.js"></script>
</body>
</html>
